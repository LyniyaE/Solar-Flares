[project]
name = "solarflares"
version = "0.1.0"
description = "Analyzing solar flares in EPRV spectra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "astropy",
    "spectres>=2.2.2",
    "frizzle>=0.2.7",
    # jax 0.10.2 removed an internal symbol (`not_mapped`) that jax-finufth 1.3.1
    # -- pulled in by frizzle -- still imports, so pin to the last working jax.
    "jax==0.10.1",
    "barycorrpy>=0.4.4",
]

[project.optional-dependencies]
# Extras for working with the notebooks (flare_pipeline / flare_frizzle).
notebook = [
    "ipykernel",
    "jupyter",
    "matplotlib",
]

# Not an installable package -- just an environment + entrypoint script.
# Run with:  uv run python prepare_spectra/prepare_spectra.py --help
[tool.uv]
package = false
